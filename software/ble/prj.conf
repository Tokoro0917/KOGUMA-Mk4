# HY0020(nRF52832)のプログラムの設定(nRF Connect SDK の Kconfig)

# ---- STM32 との UART(uart0、P0.06 送る・P0.08 受ける)。DMA で受ける非同期の API ----
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_GPIO=y
# @flash のときに UART を眠らせて、P0.06 をふつうの出力にするため
CONFIG_PM_DEVICE=y

# uart0 は STM32 につながっているので、文字の出力(コンソール・ログ)には使わない。ログは SWD の RTT で見る
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

# ---- BLE(Nordic UART Service)----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
CONFIG_BT_DEVICE_NAME="KOGUMA-MK4"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=29
# 速く送るため: 2M PHY、データ長の拡張、MTU 247
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# ---- 名前を Flash に残す(settings + NVS)----
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# ---- BLE での書き換え(DFU。MCUboot と MCUmgr。sysbuild.conf で MCUboot を入れる)----
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# 書き換えを速くする設定はバッファを大きくして RAM(64KB)に入らないので使わない
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=n
# MCUmgr の受けるバッファ(初めは 2475 バイト × 4 で約 10KB)を小さく。BLE の 1 回分(MTU 247)より大きければ動く
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
